<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Typeshi Clothing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="home.html">
                <img src="Images/white_logo.png" alt="Typeshi Clothing" class="logo-image">
            </a>
        </div>
        <nav>
            <a href="home.html" class="active">HOME</a>
            <a href="collection.html">COLLECTIONS</a>
            <a href="sizechart.html">SIZE CHART</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <section class="contact-page">
        <div class="contact-container">
            <h1 class="contact-title">CONTACT US</h1>
            <form>
                <div class="form-group">
                    <label>YOUR NAME *</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>YOUR LAST NAME *</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>PHONE NUMBER *</label>
                    <input type="tel" required>
                </div>
                <div class="form-group">
                    <label>SUBJECT *</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>EMAIL *</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>COMMENT *</label>
                    <textarea required></textarea>
                </div>
                <button type="submit" class="submit-button">SEND</button>
            </form>
            <div class="social-icons">
                <a>
                    <img src="Images/socmed.png" alt="Social Media">
                </a>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-logo">
            <img src="Images/logo.png" alt="Typeshi Clothing">
        </div>
        <p>© 2025 Typeshi Clothing. Designed with care for everyday comfort.</p>
    </footer>
</body>
</html>
